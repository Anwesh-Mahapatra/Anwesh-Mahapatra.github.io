<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  {% seo %}
  {% feed_meta %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Home">
        <span class="prompt">$</span> anwesh<span class="cursor" aria-hidden="true">_</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}">Posts</a>
        <a href="{{ site.linkedin_url }}" rel="me noopener">LinkedIn</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="content" class="shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}</span>
      <a href="{{ site.linkedin_url }}" rel="me noopener">Connect on LinkedIn</a>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
